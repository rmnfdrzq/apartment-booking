services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apartment-booking-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/apartments.db
      - APP_TITLE=Apartment Booking API
      - APP_VERSION=1.0.0
    volumes:
      - apartment_data:/app/data
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  apartment_data:
    name: apartment_data
