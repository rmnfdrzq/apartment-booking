# GitLab CI for the Apartment Booking app — same checks as .github/workflows/:
#   Workflow 1 "Build & Unit Tests": unit-tests + docker-image (Kaniko build)
#   Workflow 2 "Coverage Gate":      coverage-check (fails below 80 %)
# Test results appear under the pipeline's "Tests" tab, coverage on the job and in merge requests.

workflow:
  rules:
    # One pipeline per change: merge request pipelines for MRs, branch pipelines otherwise.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - quality

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  COVERAGE_MIN: "80"

.python:
  image: python:3.12
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

# ---- Workflow 1: build & unit tests --------------------------------------------

unit-tests:
  extends: .python
  stage: test
  timeout: 15m
  script:
    - python -c "from app.main import app; print(len(app.openapi()['paths']), 'API paths')"
    - python -m pytest --no-cov --junitxml=reports/unit-tests.xml
  after_script:
    - python scripts/ci_summary.py --junit reports/unit-tests.xml || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/unit-tests.xml
    reports:
      junit: reports/unit-tests.xml

docker-image:
  # Builds the image from the same Dockerfile with Kaniko, which needs no Docker daemon and no
  # privileged mode (the university shared runners do not allow Docker-in-Docker).
  # Every Dockerfile instruction is executed, so a broken Dockerfile or dependency fails this job.
  stage: build
  timeout: 15m
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "apartment-booking:ci"
      --no-push
      --tar-path image.tar
    - ls -lh image.tar
    - echo "Docker image apartment-booking:ci built successfully."

# ---- Workflow 2: coverage gate --------------------------------------------------

coverage-check:
  extends: .python
  stage: quality
  needs: []
  timeout: 15m
  script:
    # Failing tests are reported by unit-tests; this job only judges coverage.
    - >
      python -m pytest -q
      --cov=app --cov-report=term-missing
      --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html
      || echo "Some tests failed (see the unit-tests job); coverage is still measured."
    - python -m coverage report --fail-under="$COVERAGE_MIN" --format=total
  after_script:
    - python scripts/ci_summary.py --coverage reports/coverage.xml --threshold "$COVERAGE_MIN" || true
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
